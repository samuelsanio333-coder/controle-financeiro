<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d35d8">
<title>Controle Financeiro</title>
<style>
:root{--p:#6d35d8;--bg:#f5f4f8;--card:#fff;--text:#18181b;--muted:#74747d;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{padding:24px 20px 14px;background:linear-gradient(135deg,#4d20a7,#7b43df);color:white;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:27px;font-weight:800}.sub{opacity:.8;font-size:14px;margin-top:3px}
.balance{margin-top:18px;background:rgba(255,255,255,.12);padding:18px;border-radius:20px}.balance small{opacity:.8}.balance strong{display:block;font-size:32px;margin:5px 0}.pill{font-size:12px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:20px;display:inline-block}
main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:18px;padding:15px;box-shadow:0 2px 12px #00000009}.metric small{color:var(--muted)}.metric b{display:block;font-size:18px;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.purple{color:var(--p)}
.section{font-size:18px;font-weight:800;margin:22px 2px 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.item-title{font-weight:700}.item-sub{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;padding:14px;font-weight:800;font-size:15px;background:var(--p);color:white}.btn.secondary{background:#eee;color:#333}
nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ddd;z-index:5}nav button{border:0;background:none;color:#777;font-size:11px}nav .active{color:var(--p);font-weight:800}.plus{background:var(--p)!important;color:white!important;width:54px;height:54px;border-radius:50%;font-size:27px!important;box-shadow:0 5px 15px #6d35d855}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet{background:white;border-radius:28px 28px 0 0;padding:20px;width:100%;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 15px}.field{margin:11px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white}.close{float:right;border:0;background:#eee;border-radius:50%;width:35px;height:35px}
.empty{padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><div><div class="title">Dashboard</div><div class="sub">Visão geral das suas finanças</div></div><div>🔔</div></div>
  <div class="balance"><small>Saldo estimado</small><strong id="balance">R$ 0,00</strong><span class="pill">Controle da revenda</span></div>
</header>
<main>
  <div class="grid">
    <div class="card metric"><small>Faturamento</small><b class="green" id="revenue">R$ 0,00</b></div>
    <div class="card metric"><small>Compras</small><b id="purchases">R$ 0,00</b></div>
    <div class="card metric"><small>Lucro líquido</small><b class="green" id="profit">R$ 0,00</b></div>
    <div class="card metric"><small>Despesas</small><b class="red" id="expenses">R$ 0,00</b></div>
  </div>

  <div class="section">Resumo do mês</div>
  <div class="card">
    <div class="row"><span>Vendas</span><b class="green" id="sRevenue">R$ 0,00</b></div>
    <div class="row"><span>Compras</span><b class="red" id="sPurchases">- R$ 0,00</b></div>
    <div class="row"><span>Despesas</span><b class="red" id="sExpenses">- R$ 0,00</b></div>
    <div class="row"><span>Lucro líquido</span><b class="green" id="sProfit">R$ 0,00</b></div>
  </div>

  <div class="section">Acesso rápido</div>
  <div class="actions">
    <button class="btn" onclick="openModal('purchase')">＋ Nova compra</button>
    <button class="btn" onclick="openModal('sale')">＋ Nova venda</button>
    <button class="btn secondary" onclick="openModal('expense')">＋ Nova despesa</button>
    <button class="btn secondary" onclick="showTab('stock')">📦 Ver estoque</button>
  </div>

  <div class="section" id="listTitle">Atividade recente</div>
  <div class="card" id="list"></div>
</main>

<nav>
 <button class="active" onclick="showTab('home')">⌂<br>Início</button>
 <button onclick="showTab('stock')">▣<br>Estoque</button>
 <button class="plus" onclick="openModal('purchase')">+</button>
 <button onclick="showTab('sales')">◇<br>Vendas</button>
 <button onclick="showTab('expenses')">▤<br>Despesas</button>
</nav>

<div class="modal" id="modal"><div class="sheet">
<button class="close" onclick="closeModal()">×</button>
<h2 id="modalTitle">Nova compra</h2>
<div id="form"></div>
</div></div>

<script>
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
let data=JSON.parse(localStorage.getItem('cf_data')||'{"purchases":[],"sales":[],"expenses":[]}');
const save=()=>localStorage.setItem('cf_data',JSON.stringify(data));
const money=n=>BRL.format(Number(n)||0);
function totals(){
 const rev=data.sales.reduce((s,x)=>s+ +x.price,0);
 const pur=data.purchases.reduce((s,x)=>s+ +x.cost,0);
 const exp=data.expenses.reduce((s,x)=>s+ +x.amount,0);
 const profit=rev-pur-exp;
 return {rev,pur,exp,profit};
}
function render(){
 const t=totals();
 document.querySelector('#balance').textContent=money(t.rev-t.pur-t.exp);
 document.querySelector('#revenue').textContent=money(t.rev);
 document.querySelector('#purchases').textContent=money(t.pur);
 document.querySelector('#profit').textContent=money(t.profit);
 document.querySelector('#expenses').textContent=money(t.exp);
 document.querySelector('#sRevenue').textContent=money(t.rev);
 document.querySelector('#sPurchases').textContent='- '+money(t.pur);
 document.querySelector('#sExpenses').textContent='- '+money(t.exp);
 document.querySelector('#sProfit').textContent=money(t.profit);
 const all=[
  ...data.sales.map(x=>({date:x.date,title:'Venda — '+x.phone,sub:'Venda',amount:x.price,cls:'green'})),
  ...data.purchases.map(x=>({date:x.date,title:'Compra — '+x.phone,sub:'Compra',amount:x.cost,cls:'red'})),
  ...data.expenses.map(x=>({date:x.date,title:x.title,sub:x.category,amount:x.amount,cls:'red'}))
 ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);
 document.querySelector('#list').innerHTML=all.length?all.map(x=>`<div class="row"><div><div class="item-title">${esc(x.title)}</div><div class="item-sub">${esc(x.sub)} · ${new Date(x.date).toLocaleDateString('pt-BR')}</div></div><div class="amount ${x.cls}">${x.cls==='green'?'+':'-'} ${money(x.amount)}</div></div>`).join(''):'<div class="empty">Nenhum lançamento ainda.<br>Use os botões acima para começar.</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openModal(type){
 document.querySelector('#modal').style.display='flex';
 const title={purchase:'Nova compra',sale:'Nova venda',expense:'Nova despesa'}[type];
 document.querySelector('#modalTitle').textContent=title;
 let f='';
 if(type==='purchase') f=`<div class="field"><label>Modelo</label><input id="fphone" placeholder="Ex.: iPhone 11 64 GB"></div><div class="field"><label>Valor do aparelho</label><input id="fcost" type="number" step="0.01" placeholder="600"></div><div class="field"><label>Custos extras (viagem, conserto, acessórios)</label><input id="fextra" type="number" step="0.01" placeholder="110"></div><div class="field"><label>Vendedor</label><input id="fseller" placeholder="Marketplace"></div><button class="btn" onclick="addPurchase()">Salvar compra</button>`;
 if(type==='sale') f=`<div class="field"><label>Aparelho</label><select id="fphone">${data.purchases.filter(x=>!x.sold).map(x=>`<option value="${x.id}">${esc(x.phone)} — ${money(x.cost)}</option>`).join('')}</select></div><div class="field"><label>Valor da venda</label><input id="fprice" type="number" step="0.01" placeholder="1050"></div><div class="field"><label>Forma de pagamento</label><select id="fpayment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div><button class="btn" onclick="addSale()">Confirmar venda</button>`;
 if(type==='expense') f=`<div class="field"><label>Descrição</label><input id="ftitle" placeholder="Ex.: Viagem para buscar aparelho"></div><div class="field"><label>Valor</label><input id="famount" type="number" step="0.01" placeholder="120"></div><div class="field"><label>Categoria</label><select id="fcat"><option>Viagens</option><option>Passagens</option><option>Combustível</option><option>Consertos</option><option>Alimentação</option><option>Anúncios</option><option>Outros</option></select></div><button class="btn" onclick="addExpense()">Salvar despesa</button>`;
 document.querySelector('#form').innerHTML=f||'<div class="empty">Cadastre uma compra primeiro.</div>';
}
function closeModal(){document.querySelector('#modal').style.display='none'}
function addPurchase(){let phone=fphone.value.trim();let cost=+fcost.value||0;let extra=+fextra.value||0;if(!phone||cost<=0)return alert('Informe o aparelho e o valor.');data.purchases.push({id:crypto.randomUUID(),phone,cost:cost+extra,seller:fseller.value,date:new Date().toISOString(),sold:false});save();closeModal();render()}
function addSale(){if(!fphone||!fphone.value)return alert('Cadastre uma compra antes de vender.');let p=data.purchases.find(x=>x.id===fphone.value);let price=+fprice.value||0;if(!p||price<=0)return alert('Informe o valor da venda.');p.sold=true;data.sales.push({id:crypto.randomUUID(),purchaseId:p.id,phone:p.phone,cost:p.cost,price,payment:fpayment.value,date:new Date().toISOString()});save();closeModal();render()}
function addExpense(){let title=ftitle.value.trim(),amount=+famount.value||0;if(!title||amount<=0)return alert('Informe a descrição e o valor.');data.expenses.push({id:crypto.randomUUID(),title,amount,category:fcat.value,date:new Date().toISOString()});save();closeModal();render()}
function showTab(tab){
 if(tab==='home'){document.querySelector('#listTitle').textContent='Atividade recente';render();return}
 if(tab==='stock'){document.querySelector('#listTitle').textContent='Estoque';let items=data.purchases.filter(x=>!x.sold);document.querySelector('#list').innerHTML=items.length?items.map(x=>`<div class="row"><div><div class="item-title">${esc(x.phone)}</div><div class="item-sub">${esc(x.seller||'Sem vendedor')}</div></div><div class="amount purple">${money(x.cost)}</div></div>`).join(''):'<div class="empty">Nenhum aparelho em estoque.</div>';return}
 if(tab==='sales'){document.querySelector('#listTitle').textContent='Vendas';let items=data.sales;document.querySelector('#list').innerHTML=items.length?items.map(x=>{let p=data.purchases.find(p=>p.id===x.purchaseId);let lucro=x.price-(p?p.cost:x.cost);return `<div class="row"><div><div class="item-title">${esc(x.phone)}</div><div class="item-sub">${x.payment} · ${new Date(x.date).toLocaleDateString('pt-BR')}</div></div><div><div class="amount green">${money(x.price)}</div><div class="item-sub green">Lucro ${money(lucro)}</div></div></div>`}).join(''):'<div class="empty">Nenhuma venda registrada.</div>';return}
 if(tab==='expenses'){document.querySelector('#listTitle').textContent='Despesas';let items=data.expenses;document.querySelector('#list').innerHTML=items.length?items.map(x=>`<div class="row"><div><div class="item-title">${esc(x.title)}</div><div class="item-sub">${x.category} · ${new Date(x.date).toLocaleDateString('pt-BR')}</div></div><div class="amount red">- ${money(x.amount)}</div></div>`).join(''):'<div class="empty">Nenhuma despesa registrada.</div>'}
}
render();
</script>
</body>
</html>
